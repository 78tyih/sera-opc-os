name: Creator Intelligence Smoke ASR Fallback

on:
  workflow_dispatch:
  push:
    paths:
      - business/sera-creator-intelligence/.asr-trigger

permissions:
  contents: read

jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp bgutil-ytdlp-pot-provider faster-whisper

      - name: Start BgUtils PO Token provider
        run: |
          docker run -d --name bgutil-provider -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider:1.3.2
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO provider ready"
              exit 0
            fi
            sleep 1
          done
          docker logs bgutil-provider || true
          exit 1

      - name: Run audio + ASR fallback
        env:
          WHISPER_MODEL: small
          HF_HOME: /tmp/hf-cache
        run: |
          python business/sera-creator-intelligence/scripts/cloud_smoke_asr.py \
            --output /tmp/creator-intelligence-asr \
            --model small

      - name: Upload transcript-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator-intelligence-smoke-asr
          path: /tmp/creator-intelligence-asr
          retention-days: 1
          if-no-files-found: error
