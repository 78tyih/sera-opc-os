name: Learning OS Tests

on:
  push:
    paths:
      - "core/sera_learning_os/**"
      - "runtime/schemas/learning-signal.schema.yaml"
      - ".github/workflows/learning-os-tests.yml"
  pull_request:
    paths:
      - "core/sera_learning_os/**"
      - "runtime/schemas/learning-signal.schema.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Learning OS unit tests
        run: python -m unittest discover -s core/sera_learning_os -p "test_*.py" -v
