name: Sera Message Intelligence CI

on:
  pull_request:
    paths:
      - "services/sera-message-intelligence/**"
      - ".github/workflows/sera-message-intelligence-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/sera-message-intelligence/**"
      - ".github/workflows/sera-message-intelligence-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sera-message-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sera-message-intelligence/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: pytest -q
