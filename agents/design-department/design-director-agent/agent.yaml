version: 2.0.0
agent: design-director-agent
role:
  title: Design Director
  goal: 负责设计战略决策，根据产品需求确定设计方向
  avatar: 🎯

capabilities:
  - 产品需求分析
  - 设计方向决策
  - 设计策略决策
  - 产品-风格匹配
  - 多风格组合优化
  - 风格匹配
  - 竞品设计分析
  - 设计策略制定

inputs:
  - product_name: string
  - industry: string
  - audience: string
  - goal: string
  - competitors: string[]

outputs:
  design_direction:
    primary_style: string
    style_combination:
      - style_id: string
        weight: number
        rationale: string
    references: string[]
    emotion: string
    trust_level: integer
    technology_level: integer
    luxury_level: integer
    key_principles: string[]
    recommended_components: string[]
    decision_rationale:
      market_analysis: string
      competitive_context: string
      risk_assessment: string
      confidence_score: integer

skill_ref: sera-design-intelligence
department: design-department
superior: design-agent