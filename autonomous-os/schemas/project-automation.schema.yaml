# Project Automation Schema v1.0
project_automation:
  type: object
  required: [id, project_id, team_id, phase, tasks, milestones, status]
  properties:
    id: { type: string, pattern: "^PAU-\\d{8}-\\d{3}$" }
    project_id: { type: string }
    team_id: { type: string }
    phase:
      type: object
      properties:
        current: { type: string, enum: [concept, planning, execution, launch, operations, sunset] }
        started_at: { type: string, format: date-time }
        scheduled_end: { type: string, format: date-time }
    tasks:
      type: array
      items:
        type: object
        properties:
          id: { type: string }
          assignee: { type: string }
          description: { type: string }
          priority: { type: integer, minimum: 1, maximum: 5 }
          status: { type: string, enum: [pending, in_progress, completed, blocked] }
          dependencies: { type: array, items: { type: string } }
          estimated_hours: { type: number }
    milestones:
      type: array
      items:
        type: object
        properties:
          name: { type: string }
          due_date: { type: string, format: date-time }
          status: { type: string, enum: [pending, achieved, missed] }
          completed_at: { type: string, format: date-time, nullable: true }
    metrics:
      type: object
      properties:
        velocity: { type: number }
        completion_rate: { type: number }
        blocker_count: { type: integer }
    status: { type: string }
    created_at: { type: string, format: date-time }