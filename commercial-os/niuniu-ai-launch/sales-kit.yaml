## 销售话术

```yaml
scripts:
  initial_contact:
    channel: "telegram"
    template: |
      Hi {name}，
      看到你在 {group} 很活跃。
      我们最近做了一个 AI 交易助手，可以：
      → 自动识别交易信号
      → 实时风险分析
      → 个性化策略建议
      目前有 {n} 个交易员在用。
      想看看 Demo 吗？免费的。

  follow_up_1:
    delay: "3 days"
    template: |
      Hi {name}，还在考虑吗？
      送你 7 天免费试用，无风险体验。

  follow_up_2:
    delay: "7 days"
    template: |
      {name}，最后机会：
      前 100 名用户终身 7 折。
      还剩 {remaining} 个名额。

  demo:
    duration: "15 min"
    agenda:
      - "了解用户交易方式"
      - "展示 NiuNiu AI 如何匹配需求"
      - "回答疑问"
      - "引导试用"
    close: "今天开通试用，7 天免费。"

  objection_handling:
    - objection: "担心准确率"
      response: "我们回测准确率 78%，而且持续优化。先试用 7 天，你自己验证。"

    - objection: "太贵了"
      response: "Pro 版 $99/月，如果帮你多赚 $500/月，ROI 是 5 倍。"

    - objection: "需要时间学习"
      response: "5 分钟设置，15 分钟学会。我带你走一遍。"
```

