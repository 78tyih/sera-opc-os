# Brand Package Schema v1.0
brand_package:
  type: object
  required: [project, tagline, strategy, visual, voice]
  properties:
    project: { type: string }
    tagline: { type: string }
    strategy:
      type: object
      properties:
        positioning: { type: string }
        differentiation: { type: string }
        target_audience: { type: string }
    visual:
      type: object
      properties:
        primary_color: { type: string }
        secondary_color: { type: string }
        accent_color: { type: string }
        font_heading: { type: string }
        font_body: { type: string }
    voice:
      type: object
      properties:
        tone: { type: string }
        do: { type: array, items: { type: string } }
        dont: { type: array, items: { type: string } }
    assets:
      type: object
      properties:
        logo: { type: string }
        landing_page: { type: string, nullable: true }
        brand_guidelines: { type: string, nullable: true }

# Campaign Schema v1.0
campaign:
  type: object
  required: [id, name, channels, budget, duration_days]
  properties:
    id: { type: string, pattern: "^CAMP-\\d{8}-\\d{3}$" }
    name: { type: string }
    channels: { type: array, items: { type: string } }
    budget: { type: number }
    duration_days: { type: integer }
    content:
      type: array
      items:
        type: object
        properties:
          type: { type: string, enum: [video, blog, post, email, ad] }
          title: { type: string }
          channel: { type: string }
          publish_date: { type: string, format: date-time }
          status: { type: string, enum: [planned, in_progress, published] }
    metrics:
      type: object
      properties:
        target_leads: { type: integer }
        target_conversion: { type: number }
        actual_leads: { type: integer, nullable: true }
        actual_revenue: { type: number, nullable: true }