# Opportunity Assessment Schema v1.0
opportunity_assessment:
  type: object
  required: [id, title, source, market, scoring, decision]
  properties:
    id: { type: string, pattern: "^OPP-\\d{8}-\\d{3}$" }
    title: { type: string }
    source: { type: string }
    market:
      type: object
      properties:
        tam: { type: number }
        sam: { type: number }
        growth_rate: { type: number }
        market_stage: { type: string, enum: [emerging, growing, mature, declining] }
    product:
      type: object
      properties:
        capability_match: { type: number, minimum: 0, maximum: 100 }
        time_to_weeks: { type: integer }
        technical_risk: { type: string, enum: [low, medium, high] }
        competitive_advantage: { type: array, items: { type: string } }
    business:
      type: object
      properties:
        expected_margin: { type: number }
        payback_months: { type: integer }
        revenue_potential: { type: string, enum: [immediate, 3_months, 6_months, 12_months] }
        scalability: { type: number, minimum: 0, maximum: 100 }
    strategic:
      type: object
      properties:
        okr_alignment: { type: number, minimum: 0, maximum: 100 }
        brand_fit: { type: number, minimum: 0, maximum: 100 }
        learning_value: { type: string }
        network_effect: { type: boolean }
    scoring:
      type: object
      properties:
        total: { type: number, minimum: 0, maximum: 100 }
        breakdown:
          type: object
          properties:
            market: { type: number, minimum: 0, maximum: 100 }
            product: { type: number, minimum: 0, maximum: 100 }
            business: { type: number, minimum: 0, maximum: 100 }
            strategic: { type: number, minimum: 0, maximum: 100 }
    decision:
      type: object
      properties:
        verdict: { type: string, enum: [go, investigate, watch, drop] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        rationale: { type: string }
        next_steps: { type: array, items: { type: string } }
    created_at: { type: string, format: date-time }