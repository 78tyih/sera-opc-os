  # ============ Product Factory：产品发布（product-agent）============
  - id: product-init
    intent: 产品发布/项目初始化
    agent: product-agent
    keywords:
      - 产品发布
      - 推广
      - 推广产品
      - 新产品
      - 项目初始化
      - 产品项目
      - 创建项目
      - 产品分析
      - 产品手册
      - 项目档案
      - product launch
      - 产品定位
      - 产品规划
      - 产品定义
      - 发布计划
      - 启动项目
    pipeline:
      - sera-grill
      - sera-project-profile
      - sera-product-analysis
      - sera-market-research
      - sera-user-persona
      - sera-positioning
      - sera-copywriting
      - sera-product-manual
    finalize:
      - sera-knowledge-sync
      - sera-context-system

  # ============ 复合：多 Agent 编排（完整产品发布流水线）============
  - id: product-factory-pipeline
    intent: 完整产品发布流水线（多 Agent）
    agent: multi
    keywords:
      - 发布页
      - 产品页
