# Sera Agent Router — 路由规则表
# 自然语言意图 → Agent/Skill 编排链
# 优先级从上到下（先匹配先命中）；规则 = 关键词列表（任一命中即触发）

version: 1.0.0

routes:
  # ============ 远程算力（最高优先级，compute > grill > domain）============
  - id: compute
    intent: 远程算力
    agent: core
    keywords:
      - serawin
      - 远程
      - windows
      - comfyui
      - ollama
      - gpu
      - 台式机
      - 渲染服务器
    pipeline:
      - sera-compute-control
    finalize: []

  # ============ Grill：目标/范围/取舍澄清 ============
  - id: grill-clarify
    intent: 目标/范围/决策澄清
    agent: core
    keywords:
      - grill me
      - grillme
      - greenme
      - sera_grill
      - 盘问我
      - 追问我
      - 帮我想清楚
      - 需求澄清
      - 目标澄清
      - 范围澄清
      - 需求不清
      - 方向不清
      - 新架构
      - 架构方案
      - 技术选型
      - 复杂工作流
      - 我想做一个
    pipeline:
      - sera-grill
    finalize: []

  # ============ CEO Agent：最高决策层 ============
  - id: ceo-decision
    intent: CEO 决策/项目评估
    agent: sera-ceo-agent
    keywords:
      - 评估项目
      - 值不值得做
      - 商业机会
      - 要不要做
      - 项目决策
      - ceo
      - 战略决策
    pipeline:
      - sera-decision-framework
      - sera-priority-engine
    finalize:
      - sera-knowledge-sync
      - portfolio/registry/projects.json 更新

  # ============ 完整产品发布流水线（Grill → CEO → Factory）============
  - id: company-product-launch
    intent: 完整产品发布
    agent: multi
    keywords:
      - 我要做
      - 发布产品
      - 启动产品
      - 新产品发布
      - 完整发布
    pipeline:
      - sera-grill
      - sera-ceo-agent:sera-decision-framework
      - product-agent:sera-project-profile
      - product-agent:sera-product-analysis
      - product-agent:sera-market-research
      - product-agent:sera-user-persona
      - product-agent:sera-positioning
      - product-agent:sera-copywriting
      - product-agent:sera-product-manual
      - design-agent:sera-design-studio
      - design-agent:sera-design-intelligence
      - video-agent:sera-video-pipeline
      - video-agent:sera-content-factory
    finalize:
      - sera-knowledge-sync
      - sera-context-system

  # ============ Creator Intelligence（内容研究/学习，必须先于视频生产）============
  - id: creator-intelligence
    intent: Creator/频道内容研究与知识沉淀
    agent: core
    keywords:
      - creator intelligence
      - creator analysis
      - youtube channel
      - youtube 知识库
      - youtube知识库
      - 频道分析
      - 分析频道
      - 分析博主
      - 博主分析
      - 自媒体分析
      - 视频总结
      - 视频拆解
      - 视频文字稿
      - 文字稿
      - transcript
      - 哪些视频最值得看
      - 值得看的视频
      - 论点论据
      - 内容分布
      - 内容沉淀
      - 博主知识库
      - 监控博主
    pipeline:
      - sera-creator-intelligence
    finalize:
      - sera-knowledge-sync
      - sera-context-system

  # ============ 内容生产（video-agent）============
  - id: video-produce
    intent: 视频/素材生产
    agent: video-agent
    keywords:
      - 视频
      - 短视频
      - 口播
      - 数字人
      - 合成
      - B-roll
      - 素材工厂
      - 官网素材
      - 生成视频
    pipeline:
      - sera-content-factory
      - sera-video-pipeline
      - sera-asset-manager
      - sera-compute-control
    finalize:
      - sera-knowledge-sync

  # ============ PropFirm 情报（propfirm-agent）============
  - id: propfirm-intel
    intent: PropFirm 情报/竞品
    agent: propfirm-agent
    keywords:
      - propfirm
