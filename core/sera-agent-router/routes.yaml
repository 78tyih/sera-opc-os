# Sera Agent Router — 路由规则表
# 自然语言意图 → Agent/Skill 编排链
# 优先级从上到下（先匹配先命中）；规则 = 关键词列表（任一命中即触发）

version: 1.0.0

routes:
  # ============ 远程算力（最高优先级，compute > grill > domain）============
  - id: compute
    intent: 远程算力
    agent: core
    keywords:
      - serawin
      - 远程
      - windows
      - comfyui
      - ollama
      - gpu
      - 台式机
      - 渲染服务器
    pipeline:
      - sera-compute-control
    finalize: []

  # ============ Grill：目标/范围/取舍澄清 ============
  - id: grill-clarify
    intent: 目标/范围/决策澄清
    agent: core
    keywords:
      - grill me
      - grillme
      - greenme
      - sera_grill
      - 盘问我
      - 追问我
      - 帮我想清楚
      - 需求澄清
      - 目标澄清
      - 范围澄清
      - 需求不清
      - 方向不清
      - 新架构
      - 架构方案
      - 技术选型
      - 复杂工作流
      - 我想做一个
    pipeline:
      - sera-grill
    finalize: []

  # ============ CEO Agent：最高决策层 ============
  - id: ceo-decision
    intent: CEO 决策/项目评估
    agent: sera-ceo-agent
    keywords:
      - 评估项目
      - 值不值得做
      - 商业机会
      - 要不要做
      - 项目决策
      - ceo
      - 战略决策
    pipeline:
      - sera-decision-framework
      - sera-priority-engine
    finalize:
      - sera-knowledge-sync
      - portfolio/registry/projects.json 更新

  # ============ 完整产品发布流水线（Grill → CEO → Factory）============
  - id: company-product-launch
    intent: 完整产品发布
    agent: multi
    keywords:
      - 我要做
      - 发布产品
      - 启动产品
      - 新产品发布
      - 完整发布
    pipeline:
      - sera-grill
      - sera-ceo-agent:sera-decision-framework
      - product-agent:sera-project-profile
      - product-agent:sera-product-analysis
      - product-agent:sera-market-research
      - product-agent:sera-user-persona
      - product-agent:sera-positioning
      - product-agent:sera-copywriting
      - product-agent:sera-product-manual
      - design-agent:sera-design-studio
      - design-agent:sera-design-intelligence
      - video-agent:sera-video-pipeline
      - video-agent:sera-content-factory
    finalize:
      - sera-knowledge-sync
      - sera-context-system

  # ============ 内容生产（video-agent）============
  - id: video-produce
    intent: 视频/素材生产
    agent: video-agent
    keywords:
      - 视频
      - 短视频
      - 口播
      - 数字人
      - 合成
      - B-roll
      - 素材工厂
      - 官网素材
      - 生成视频
    pipeline:
      - sera-content-factory        # 官网素材 → 5s B-roll
      - sera-video-pipeline         # 口播 → 知识短视频合成
      - sera-asset-manager          # 入库 Eagle
      - sera-compute-control        # serawin 远程渲染（重活）
    finalize:
      - sera-knowledge-sync         # 归档 Obsidian

  # ============ PropFirm 情报（propfirm-agent）============
  - id: propfirm-intel
    intent: PropFirm 情报/竞品
    agent: propfirm-agent
    keywords:
      - propfirm
      - 考试盘
      - 竞品
      - 情报
      - 优惠
      - 规则更新
      - 出金
      - 推送
      - 官网拆解
      - 产品对比
      - 营销素材
      - 规则
      - topstep
      - tradeify
      - fundednext
      - takeprofittrader
      - apex
      - tradeday
      - blue guardian
      - lucid
      - fff
    pipeline:
      - sera-intelligence-monitor    # 采集→过滤→门禁→推送
      - sera-browser-automation      # 官网抓取/交互截图
      - sera-content-factory         # 素材生产
    finalize:
      - sera-knowledge-sync

  # ============ Product Factory：产品发布（product-agent）============
  - id: product-init
    intent: 产品发布/项目初始化
    agent: product-agent
    keywords:
      - 产品发布
      - 推广
      - 推广产品
      - 新产品
      - 项目初始化
      - 产品项目
      - 创建项目
      - 产品分析
      - 产品手册
      - 项目档案
      - product launch
      - 产品定位
      - 产品规划
      - 产品定义
      - 发布计划
      - 启动项目
    pipeline:
      - sera-grill                        # 先澄清目标/范围/取舍
      - sera-project-profile              # 项目初始化
      - sera-product-analysis             # 产品理解
      - sera-market-research              # 市场研究
      - sera-user-persona                 # 用户画像
      - sera-positioning                  # 产品定位
      - sera-copywriting                  # 文案撰写
      - sera-product-manual               # 产品手册
    finalize:
      - sera-knowledge-sync
      - sera-context-system

  # ============ 复合：多 Agent 编排（完整产品发布流水线）============
  - id: product-factory-pipeline
    intent: 完整产品发布流水线（多 Agent）
    agent: multi
    keywords:
      - 发布页
      - 产品页
      - 落地页
      - landing page
      - 网站
      - 官网
      - 产品发布页
      - 产品官网
    pipeline:
      - sera-grill                              # Scope 未清时先收敛；清晰 Spec 可跳过
      - product-agent:sera-project-profile    # 产品定义
      - product-agent:sera-market-research    # 市场研究
      - product-agent:sera-positioning        # 定位
      - product-agent:sera-copywriting        # 文案
      - design-agent:sera-design-studio       # 品牌+视觉设计
      - design-agent:sera-asset-manager       # 素材管理
      - video-agent:sera-video-pipeline       # 视频内容
      - design-agent:sera-design-intelligence  # 设计智能分析
      - figma-review                          # 设计审查（代码级）
      - ux-conversion-agent:sera-design-intelligence  # UX 转化审查⭐
      - design-critic-agent:sera-design-intelligence  # 设计总监审查（设计级）⭐
    finalize:
      - sera-knowledge-sync
      - sera-context-system

  # ============ 设计智能流水线（完整）============
  - id: design-intelligence-pipeline
    intent: 完整设计智能流水线
    agent: multi
    keywords:
      - 设计智能
      - 设计方向
      - 设计系统
      - 设计流水线
      - 生成设计
      - 设计方案
    pipeline:
      - design-director-agent:sera-design-intelligence       # 设计战略
      - design-extraction-agent:sera-design-intelligence     # 知识提取
      - design-system-agent:sera-design-studio               # 系统生成
      - design-generator-agent:sera-design-studio            # 页面生成
      - ux-conversion-agent:sera-design-intelligence         # 转化审查
      - design-critic-agent:sera-design-intelligence         # 设计审查
      - asset-manager-agent:sera-asset-manager               # 资产生成
    finalize:
      - sera-knowledge-sync
      - sera-context-system

  # ============ 设计方向决策（design-director）============
  - id: design-direction
    intent: 设计方向/策略
    agent: design-department
    keywords:
      - 设计方向
      - 设计策略
      - 设计定位
      - 设计决策
      - 风格选择
      - 设计总监
      - 设计风格
      - 品牌方向
    pipeline:
      - design-director-agent:sera-design-intelligence
    finalize:
      - sera-knowledge-sync

  # ============ UX 转化审查（ux-conversion）============
  - id: ux-conversion-review
    intent: UX 转化审查
    agent: design-department
    keywords:
      - 转化审查
      - 转化优化
      - CTA 审查
      - 用户路径
      - 注册流程
      - 转化率
      - conversion
      - UX 审查
    pipeline:
      - ux-conversion-agent:sera-design-intelligence
    finalize:
      - sera-knowledge-sync

  # ============ 设计审查（design-department）============
  - id: design-critic-review
    intent: 设计审查/批评
    agent: design-department
    keywords:
      - 审查设计
      - 设计批评
      - 设计评审
      - 设计总监
      - 设计检查
      - design review
      - 评审设计
    pipeline:
      - design-critic-agent:sera-design-intelligence
    finalize:
      - sera-knowledge-sync

  # ============ 设计提取（design-department）============
  - id: design-extraction
    intent: 设计提取/分析
    agent: design-department
    keywords:
      - 分析设计
      - 提取设计
      - 拆解网站
      - 设计复盘
      - design extraction
      - 设计案例
      - 参考设计
      - 保存设计
    pipeline:
      - design-research-agent:sera-browser-automation    # 捕获
      - design-extraction-agent:sera-design-intelligence  # 提取
      - design-system-agent:sera-design-studio            # 生成规范
      - asset-manager-agent:sera-asset-manager            # 入库
      - design-review-agent:figma-review                  # 审查
    finalize:
      - sera-knowledge-sync

  # ============ 设计（design-agent）============
  - id: design-produce
    intent: 设计/品牌/UI/海报
    agent: design-agent
    keywords:
      - 设计
      - 海报
      - 品牌
      - logo
      - 落地页
      - 界面
      - UI
      - 设计稿
      - 规范
      - Design Token
      - 视觉
      - 发布页
    pipeline:
      - sera-design-studio           # 设计产出
      - figma-review                 # 审查门禁
    finalize:
      - sera-knowledge-sync

  # ============ 交易研究（trading-agent）============
  - id: trading-research
    intent: 交易研究/复盘
    agent: trading-agent
    keywords:
      - 复盘
      - 交易
      - 策略
      - 回测
      - ATAS
      - 订单流
      - order flow
      - 胜率
      - 盈亏比
      - 市场结构
      - 量化
    pipeline:
      - trading-analysis             # 复盘/回测/订单流
      - sera-finance-suite           # 行情/数据辅助
      - sera-knowledge-reader        # 历史研究检索
    finalize:
      - sera-knowledge-sync

  # ============ OTC 商务（otc-agent）============
  - id: otc-bd
    intent: OTC 商务/客户
    agent: otc-agent
    keywords:
      - 客户
      - 报价
      - 跟进
      - OTC
      - 商务
      - 风控
      - 资信
      - 回复
      - 交易对手
    pipeline:
      - sera-crm-adapter             # 客户档案/跟进
      - sera-mail-hub                # 邮件沟通
      - sera-memory-system           # 决策记忆
    finalize:
      - sera-knowledge-sync

  # ============ 知识/记忆（系统层）============
  - id: knowledge-ops
    intent: 知识/记忆/归档
    agent: core
    keywords:
      - 归档
      - 同步到
      - 存入知识库
      - 记录
      - 记忆
      - 上下文
      - 交接
      - 状态
      - 上次做到
    pipeline:
      - sera-context-system          # 上下文读写
      - sera-state-manager           # 状态查询/更新
      - sera-knowledge-sync          # 归档
    finalize: []

  # ============ 兜底 ============
  - id: fallback
    intent: 未匹配
    agent: sera-agent-orchestrator
    keywords: []
    pipeline:
      - sera-agent-orchestrator      # 人工/LLM 判定
    finalize: []
