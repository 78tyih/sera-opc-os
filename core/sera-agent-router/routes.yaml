      - sera-grill
      - product-agent:sera-project-profile
      - product-agent:sera-market-research
      - product-agent:sera-positioning
      - product-agent:sera-copywriting
      - design-agent:sera-design-studio
      - design-agent:sera-asset-manager
      - video-agent:sera-video-pipeline
      - design-agent:sera-design-intelligence
      - figma-review
      - ux-conversion-agent:sera-design-intelligence
      - design-critic-agent:sera-design-intelligence
    finalize:
      - sera-knowledge-sync
      - sera-context-system

  # ============ 设计智能流水线（完整）============
