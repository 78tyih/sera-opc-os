name: cross-site-learning
version: 1.1.0
description: Designlang 多站测量 + Sera DNA/Pattern Governance → Canonical Design Memory

triggers:
  - "对比这些网站的设计 [URLS]"
  - "提炼多个网站共同的设计模式"
  - "cross-site design analysis"
  - "从这些参考网站提取可复用 pattern"

requirements:
  minimum_independent_sites: 2
  recommended_sites: 3
  evidence_required: true

steps:
  - id: native-multi-site-measurement
    condition: urls.length >= 2
    backend: designlang
    description: 优先利用 Designlang 自带 brands/diff/site 做多站事实比较；这是 evidence，不是 Sera Memory 结论
    tools:
      - "designlang brands <urls...>"
      - "designlang diff <url-a> <url-b>"
      - "designlang site <url>"
    outputs: [native_multi_site_evidence]

  - id: extract-each-site
    foreach: urls
    workflow: design-extraction
    outputs: [case_study, extraction_manifest, STYLE_DNA.json]

  - id: deterministic-overlap
    skill: sera-design-intelligence
    tool: cross-site/miner.py
    description: 只从 Sera STYLE_DNA 中计算独立域名支持度，不重复实现浏览器级 diff
    inputs: [STYLE_DNA.json, native_multi_site_evidence]
    outputs: [cross_site_result_json, cross_site_result_md]

  - id: semantic-review
    agent: design-strategy-agent
    description: 判断重复项是否真的是同一抽象 Pattern，补充适用/不适用场景与 trade-off
    inputs: [cross_site_result_json, case_studies, native_multi_site_evidence]
    outputs: [reviewed_pattern_candidates]

  - id: critic-gate
    agent: design-critic-agent
    description: 防止抄袭、过度抽象、单行业偏差与装饰性伪规律
    inputs: [reviewed_pattern_candidates]
    outputs: [critic_result]
    gate:
      pass: critic_result.approved == true
      fail_behavior: keep_as_study_only

  - id: promote
    skill: sera-design-intelligence
    description: 通过审核的 Pattern Candidate 才进入 canonical Pattern Library / Style Memory
    inputs: [critic_result, reviewed_pattern_candidates]
    outputs: [pattern_registry_update]

finalize:
  - sera-knowledge-sync
  - sera-context-system
