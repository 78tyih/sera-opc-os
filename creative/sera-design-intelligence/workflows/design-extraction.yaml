# Sera Design Intelligence — Evidence-first Design Extraction
name: design-extraction
version: 4.0.0
description: URL/页面 → 机器事实提取 → Evidence Normalize → Design DNA → Design Reasoning → Memory Promotion

triggers:
  - "分析这个网站的设计 [URL]"
  - "拆解 [URL] 的设计系统"
  - "提取 Design System"
  - "提取 Design Token"
  - "用 designlang 分析 [URL]"
  - "把这个网站保存为 Design Case Study"
  - "学习这个网站的设计"

principles:
  - measure_before_reason
  - facts_separate_from_inference
  - provenance_required
  - raw_immutable
  - backend_replaceable

steps:
  - id: reference-capture
    agent: design-research-agent
    description: 建立页面上下文、全页截图与 section map，作为视觉验证证据
    inputs: [url]
    outputs: [browser_capture, section_map, screenshot_refs]

  - id: extraction-preflight
    agent: design-extraction-agent
    description: 检查 designlang/Node/Chromium 环境；判断是否需要 cookie-file
    tool: extraction-engine/adapter.py
    outputs: [preflight_status]

  - id: machine-extraction
    agent: design-extraction-agent
    description: 使用默认 Designlang Backend 读取 rendered DOM / computed styles 并保存原始产物
    backend: extraction-engine/designlang-adapter.yaml
    inputs: [url, optional_cookie_file]
    outputs: [raw_designlang_artifacts, extraction_manifest]
    fallback:
      backend: sera-browser-automation
      requirement: still_emit_extraction_manifest

  - id: evidence-validation
    agent: design-extraction-agent
    description: 对照 browser capture 验证提取完整性；记录缺失项与冲突
    inputs: [extraction_manifest, browser_capture, screenshot_refs]
    outputs: [evidence_quality, evidence_conflicts]
    gate:
      pass: evidence_quality.has_provenance == true
      fail_behavior: do_not_promote_to_memory

  - id: dna-synthesis
    agent: design-extraction-agent
    description: 将 normalized evidence 转换为 Style DNA；每个关键推断保留 evidence refs
    inputs: [extraction_manifest, evidence_quality]
    schema: dna-engine/extraction-schema.json
    outputs: [STYLE_DNA.json]

  - id: design-reasoning
    agent: design-strategy-agent
    description: 回答为什么有效、品牌/层级/心理/转化逻辑、适用与不适用场景
    inputs: [STYLE_DNA.json, extraction_manifest, screenshot_refs]
    outputs: [design_reasoning, reusable_patterns, anti_patterns, suitability_notes]

  - id: benchmark-and-pattern
    skill: sera-design-intelligence
    description: Benchmark 与 Pattern Library 横向比较，避免把单站偶然实现当成规则
    inputs: [STYLE_DNA.json, design_reasoning]
    knowledge_ref: [benchmark/, patterns/, knowledge/]
    outputs: [benchmark_result, pattern_candidates]

  - id: case-study
    skill: sera-design-intelligence
    description: 生成 Case Study；显式区分 observed / derived / inferred / recommended
    inputs: [extraction_manifest, STYLE_DNA.json, design_reasoning, benchmark_result]
    outputs: [analysis.md, extracted-rules.md, reproduction-prompt.md]

  - id: memory-promotion
    agent: asset-manager-agent
    description: 原始证据、资产索引、Pattern/Component/Style Candidate 入库
    inputs: [extraction_manifest, pattern_candidates, STYLE_DNA.json]
    outputs: [asset_index_update, memory_candidates]

  - id: review
    agent: design-review-agent
    description: 检查 provenance、第三方资产边界、规则是否跨项目可复用
    inputs: [memory_candidates, analysis.md]
    outputs: [review_result]
    gate:
      pass: review_result.approved == true
      fail_behavior: keep_case_local_only

finalize:
  - sera-knowledge-sync
  - sera-context-system

on_error:
  retry: true
  max_retries: 2
  fallback_agent: sera-agent-orchestrator

outputs:
  base_path: creative/sera-design-intelligence/case-studies/<case-name>/
  structure:
    - raw/designlang/
    - normalized/extraction-manifest.json
    - dna/STYLE_DNA.json
    - screenshots/
    - analysis.md
    - extracted-rules.md
    - reproduction-prompt.md
    - assets/
