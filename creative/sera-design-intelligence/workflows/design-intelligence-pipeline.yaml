# Sera Design Intelligence Pipeline — V4.0
name: design-intelligence-pipeline
version: 4.0.0
description: Evidence-aware design pipeline — strategy → references → routing → generation → review → learning

triggers:
  - "设计新产品 [产品名]"
  - "生成 [产品名] 的设计方案"
  - "分析 [产品名] 的设计需求"
  - "design for [product]"

steps:
  - id: product-direction
    agent: design-director-agent
    description: 分析产品需求、目标用户与商业目标，确定设计问题
    inputs: [product_name, industry, audience, goal, optional_reference_urls]
    outputs: [design_direction, reference_strategy]

  - id: reference-intelligence
    condition: optional_reference_urls.length > 0
    workflow: design-extraction
    description: 对参考 URL 做 Evidence-first 提取；禁止仅凭截图猜设计系统
    inputs: [optional_reference_urls]
    outputs: [reference_evidence, reference_dna, reference_patterns]

  - id: psychology-analysis
    skill: sera-design-intelligence
    description: 根据产品类型与目标用户分析心理、信任与转化因素
    inputs: [design_direction, audience, reference_patterns]
    knowledge_ref: [knowledge/psychology/, knowledge/business/]
    outputs: [psychology_factors]

  - id: style-routing
    skill: sera-design-intelligence
    description: Style Router 选择候选风格；参考站点是证据，不是直接模板
    tool: style-router/router.py
    inputs: [design_direction, psychology_factors]
    outputs: [style_selection, style_weights]

  - id: dna-pattern-match
    skill: sera-design-intelligence
    description: 将产品目标、已有 Style DNA、参考 Evidence 与 Pattern Library 做匹配
    inputs: [style_selection, reference_dna, reference_patterns]
    knowledge_ref: [dna-engine/examples/, benchmark/, patterns/]
    outputs: [dna_match, selected_patterns, rejected_patterns, reasoning]

  - id: design-system
    agent: design-system-agent
    description: 生成新的产品设计系统，不复制参考站点品牌资产
    inputs: [design_direction, style_selection, selected_patterns, reasoning]
    outputs: [design_system, color_system, typography, component_specs, motion_specs]

  - id: page-generation
    agent: design-generator-agent
    description: 基于新的 Design System 生成页面
    inputs: [design_system, page_requirements]
    outputs: [page_designs]

  - id: ux-conversion-gate
    agent: ux-conversion-agent
    inputs: [page_designs, conversion_goal]
    outputs: [conversion_report]
    gate:
      pass: conversion_report.overall_score >= 70
      fail_behavior: return_to_design_system_with_issues

  - id: design-critic-gate
    agent: design-critic-agent
    inputs: [page_designs, design_direction, selected_patterns]
    outputs: [critic_report]
    gate:
      pass: critic_report.visual_score >= 70 AND critic_report.brand_score >= 70
      fail_behavior: return_to_design_system_with_issues

  - id: asset-management
    agent: asset-manager-agent
    inputs: [page_designs, design_system]
    outputs: [assets, asset_index]

  - id: memory-update
    skill: sera-design-intelligence
    description: 将采用/拒绝的 Pattern 与审查结果写入 Design Memory Candidate
    inputs: [product_name, design_direction, style_selection, selected_patterns, rejected_patterns, conversion_report, critic_report]
    outputs: [memory_update]
    knowledge_ref: [memory/design-feedback/]

finalize:
  - sera-knowledge-sync
  - sera-context-system

on_error:
  retry: true
  max_retries: 2
  fallback_agent: sera-agent-orchestrator
