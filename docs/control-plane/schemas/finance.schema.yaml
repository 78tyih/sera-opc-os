# Finance System Schema v1.0
finance:
  type: object
  required: [id, period]
  properties:
    id: { type: string }
    revenue:
      type: object
      properties:
        mrr: { type: number }
        arr: { type: number }
        one_time: { type: number }
        pipeline: { type: number }
        sources:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              amount: { type: number }
              percentage: { type: number }
    costs:
      type: object
      properties:
        ai_models:
          type: array
          items:
            type: object
            properties:
              model: { type: string }
              monthly_cost: { type: number }
              tokens_used: { type: integer }
        infrastructure:
          type: array
          items:
            type: object
            properties:
              service: { type: string }
              monthly_cost: { type: number }
        labor:
          type: object
          properties:
            agent_count: { type: integer }
            estimated_cost: { type: number }
    metrics:
      type: object
      properties:
        gross_margin: { type: number }
        cac: { type: number }
        ltv: { type: number }
        ltv_cac_ratio: { type: number }
        burn_rate: { type: number }
        runway_months: { type: number }
    budget:
      type: object
      properties:
        allocated: { type: number }
        spent: { type: number }
        remaining: { type: number }
    period:
      type: object
      required: [month]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        quarter: { type: string, pattern: "^\\d{4}-Q[1-4]$" }
    created_at: { type: string, format: date-time }