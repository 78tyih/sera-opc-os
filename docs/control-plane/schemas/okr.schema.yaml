# OKR System Schema v1.0
okr:
  type: object
  required: [id, cycle, owner, objective, key_results, status]
  properties:
    id:
      type: string
      pattern: "^OKR-\\d{4}-Q[1-4]-\\d{3}$"
    cycle: { type: string, pattern: "^\\d{4}-Q[1-4]$" }
    owner: { type: string }
    objective:
      type: object
      required: [statement, category]
      properties:
        statement: { type: string }
        category: { type: string, enum: [revenue, product, growth, quality, learning] }
        parent: { type: string, nullable: true }
        child_ids: { type: array, items: { type: string } }
    key_results:
      type: array
      minItems: 1
      maxItems: 5
      items:
        type: object
        required: [id, statement, metric, target, current, weight]
        properties:
          id: { type: string }
          statement: { type: string }
          metric: { type: string }
          baseline: { type: number }
          target: { type: number }
          current: { type: number }
          unit: { type: string }
          weight: { type: number, minimum: 0, maximum: 1 }
          status: { type: string, enum: [on_track, at_risk, behind, achieved] }
    confidence: { type: number, minimum: 0, maximum: 1 }
    health: { type: string, enum: [green, yellow, red] }
    status: { type: string, enum: [draft, active, completed, cancelled] }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }
    completed_at: { type: string, format: date-time, nullable: true }