# Intelligence OS Data Pipeline

## 摄入流水线

```yaml
pipeline:
  name: "intelligence-ingestion"
  version: 1.0

  sources:
    - id: news-api
      type: api
      provider: "NewsAPI / GDELT / Bing News"
      interval: 5min
      priority: high
      config:
        keywords:
          - "ai trading"
          - "prop firm"
          - "trading platform"
          - "fintech"
          - "crypto trading"
        sources: ["techcrunch", "coindesk", "reuters", "bloomberg"]

    - id: social-media
      type: api
      provider: "Twitter / Reddit / Telegram"
      interval: 5min
      priority: high
      config:
        channels:
          - "reddit: r/forex, r/algotrading"
          - "telegram: trading_communities"
          - "twitter: ai_trading_influencers"

    - id: competitor-sites
      type: web_scrape
      provider: "custom scraper"
      interval: 1h
      priority: high
      config:
        targets:
          - "ftmo.com"
          - "fundingpips.com"
          - "apextrader.com"
          - "lucidprop.com"

    - id: internal-data
      type: internal
      provider: "CRM / Support / Sales"
      interval: 1h
      priority: medium
      config:
        sources:
          - crm_system
          - support_tickets
          - sales_calls
          - product_analytics

    - id: research
      type: api
      provider: "ArXiv / Industry Reports"
      interval: 24h
      priority: medium

  processing:
    dedup:
      window: 24h
      field: "title + source"
      strategy: "keep_highest_relevance"

    relevance_filter:
      threshold: 0.3
      model: "gpt-4o"
      prompt: "Does this signal relate to our business? Score 0-1."

    sentiment:
      enabled: true
      model: "gpt-4o"

    entity_extraction:
      enabled: true
      entities:
        - company_names
        - product_names
        - people
        - metrics
        - technologies

  routing:
    market-intelligence:
      sources: [news-api, social-media]
      schedule: continuous

    competitor-intelligence:
      sources: [competitor-sites, social-media]
      schedule: continuous

    technology-intelligence:
      sources: [research, news-api]
      schedule: 1h

    customer-intelligence:
      sources: [internal-data]
      schedule: 1h

    financial-intelligence:
      sources: [internal-data]
      schedule: 1h

  output:
    format: signal
    storage: memory/working-memory
    ttl: 7d
    alert_threshold: critical
```

## 信号处理流水线

```yaml
signal_processing:
  stages:
    - name: ingestion
      handler: "collect_raw_signals"
      concurrency: 8
      rate_limit: 100/min

    - name: dedup
      handler: "remove_duplicates"
      window: 24h
      batch_size: 500

    - name: relevance
      handler: "score_relevance"
      model: gpt-4o
      threshold: 0.3
      batch_size: 50

    - name: categorize
      handler: "assign_category"
      categories:
        - market
        - competitor
        - technology
        - customer
        - financial
        - trend

    - name: enrich
      handler: "enrich_signal"
      enrichment:
        - sentiment_analysis
        - entity_extraction
        - impact_assessment
        - department_mapping

    - name: route
      handler: "route_to_engine"
      engines:
        - market-intelligence
        - competitor-intelligence
        - technology-intelligence
        - customer-intelligence
        - financial-intelligence
        - trend-intelligence

  metrics:
    signals_per_day: "500-2000"
    relevant_rate: "~15-25%"
    critical_rate: "~1-3%"
```

## 机会评分流水线

```yaml
opportunity_scoring:
  schedule: "每 6 小时"

  inputs:
    - market_intelligence_signals
    - competitor_intelligence_signals
    - technology_intelligence_signals
    - customer_intelligence_signals
    - financial_intelligence_signals
    - trend_intelligence_signals

  scoring:
    factors:
      - name: market_size
        weight: 0.25
        data_source: "market-intelligence + trend-intelligence"

      - name: capability_match
        weight: 0.25
        data_source: "employee-os + factory-registry"

      - name: strategic_alignment
        weight: 0.20
        data_source: "okr-system + vision"

      - name: execution_feasibility
        weight: 0.15
        data_source: "resource-manager + task-history"

      - name: financial_viability
        weight: 0.15
        data_source: "financial-intelligence"

  output:
    min_score_for_action: 70
    generate_brief: true
    notify_ceo: "score >= 85"
```