# Trend Intelligence Schema v1.0
trend_intelligence:
  type: object
  required: [id, horizon, trends]
  properties:
    id: { type: string, pattern: "^TR-\\d{8}-\\d{3}$" }
    horizon: { type: string, enum: [short_term, medium_term, long_term] }
    trends:
      type: array
      items:
        type: object
        properties:
          id: { type: string }
          name: { type: string }
          category: { type: string, enum: [market, technology, consumer, regulatory] }
          evidence:
            type: array
            items:
              type: object
              properties:
                source: { type: string }
                finding: { type: string }
                date: { type: string, format: date-time }
          trajectory:
            type: object
            properties:
              direction: { type: string, enum: [accelerating, stable, declining] }
              velocity: { type: number, minimum: 0, maximum: 1 }
              confidence: { type: number, minimum: 0, maximum: 1 }
          impact:
            type: object
            properties:
              opportunities: { type: array, items: { type: string } }
              risks: { type: array, items: { type: string } }
              timeline: { type: string }
          strategic_implication: { type: string }
    created_at: { type: string, format: date-time }