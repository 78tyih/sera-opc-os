$schema: "https://json-schema.org/draft/2020-12/schema"
title: Sera Learning Signal
version: "0.2.0"
description: >-
  Observable execution signal emitted by an Agent/Workflow at a meaningful task
  boundary. This is evidence for Learning OS, not a Rule or Skill by itself.

type: object
additionalProperties: false
required:
  - trace_id
  - project
  - task
  - source_agent
  - source_model
  - outcome
  - observed_at
  - signal_types
properties:
  trace_id:
    type: string
    minLength: 3
    maxLength: 128
  run_id:
    type: [string, "null"]
  project:
    type: string
    minLength: 1
  task:
    type: string
    minLength: 1
  source_agent:
    type: string
    minLength: 1
  source_model:
    type: string
    minLength: 1
  observed_at:
    type: string
    format: date-time
  outcome:
    enum: [success, failure, partial, cancelled]
  signal_types:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        - repeat_success
        - repeat_failure
        - anti_pattern
        - skill_gap
        - model_behavior
        - tool_behavior
        - workflow_behavior
        - rejected_fix
        - human_feedback
        - regression
  failure_mode:
    type: [string, "null"]
  root_cause:
    type: [string, "null"]
    description: Concrete, evidence-testable cause. Do not generalize from symptom alone.
  success_mechanism:
    type: [string, "null"]
  recommended_action:
    type: [string, "null"]
    description: Actionable change suggested by observable evidence. It is not automatically authoritative.
  affected_skills:
    type: array
    description: Skills plausibly affected by this signal. Enables governed Skill proposals only after Pattern verification.
    items:
      oneOf:
        - type: string
        - type: object
          additionalProperties: false
          required: [path]
          properties:
            path: {type: string, minLength: 1}
            baseline_version: {type: [string, "null"]}
            candidate_version: {type: [string, "null"]}
            portability:
              enum:
                - universal
                - model_family
                - model_specific
                - agent_shell_specific
                - tool_environment_specific
  tool_events:
    type: array
    items:
      type: object
      additionalProperties: true
      required: [tool, status]
      properties:
        tool: {type: string}
        status: {enum: [success, failure, partial]}
        evidence_ref: {type: [string, "null"]}
        error_signature: {type: [string, "null"]}
  artifacts:
    type: array
    items:
      type: string
  evaluator_results:
    type: array
    items:
      type: object
      additionalProperties: true
  human_feedback:
    type: [string, "null"]
  evidence_refs:
    type: array
    items:
      type: string
  trace_location:
    type: [string, "null"]
    description: Pointer to Runtime Event Store / external trace, not necessarily Git content.
  digest:
    type: [string, "null"]
  candidate_pattern_ids:
    type: array
    items:
      type: string
  portability_hint:
    enum:
      - universal
      - model_family
      - model_specific
      - agent_shell_specific
      - tool_environment_specific
      - unknown

allOf:
  - if:
      properties:
        outcome:
          const: failure
    then:
      anyOf:
        - required: [root_cause]
        - required: [failure_mode]

x-sera-rules:
  - "This schema MUST NOT contain private chain-of-thought/private reasoning fields."
  - "One Learning Signal MAY create a provisional Pattern; it MUST NOT directly edit a production Skill."
  - "failure_mode is symptom; Pattern promotion should prefer root_cause evidence."
  - "affected_skills metadata is advisory until the Pattern reaches verified status."
  - "A Skill proposal is not a production release; Policy/Authority Gate remains mandatory."
