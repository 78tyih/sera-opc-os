services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smi
      POSTGRES_USER: smi
      POSTGRES_PASSWORD: smi
    ports:
      - "5432:5432"
    volumes:
      - smi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smi -d smi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smi_pgdata:
